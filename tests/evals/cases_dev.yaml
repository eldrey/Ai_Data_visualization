- id: J18
  category: join
  request: Lucro mensal de cada loja (vendas menos compras menos custos).
  tables: [vendas, compras, custos, cafeterias]
  expected_behavior: chart
  reference_sql: |
    WITH receita AS (
        SELECT id_cafeteria, strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(valor_total) AS receita
        FROM vendas GROUP BY 1, 2
    ), gasto_compras AS (
        SELECT id_cafeteria, strftime(CAST(data_pedido AS DATE), '%Y-%m') AS mes, SUM(valor_total) AS compras
        FROM compras GROUP BY 1, 2
    ), gasto_custos AS (
        SELECT id_cafeteria, competencia AS mes, SUM(valor) AS custos
        FROM custos GROUP BY 1, 2
    ), resultado AS (
        SELECT k.id_cafeteria, k.mes,
               COALESCE(r.receita, 0) AS receita,
               COALESCE(r.receita, 0) - COALESCE(c.compras, 0) - k.custos AS lucro
        FROM gasto_custos k
        LEFT JOIN receita r ON r.id_cafeteria = k.id_cafeteria AND r.mes = k.mes
        LEFT JOIN gasto_compras c ON c.id_cafeteria = k.id_cafeteria AND c.mes = k.mes
    )
    SELECT c.nome, r.mes, r.lucro
    FROM resultado r
    JOIN cafeterias c ON c.id_cafeteria = r.id_cafeteria
    ORDER BY 1, 2
  chart_type: line
- id: J19
  category: join
  request: Margem de lucro de cada loja em 2025.
  tables: [vendas, compras, custos, cafeterias]
  expected_behavior: chart
  reference_sql: |
    WITH receita AS (
        SELECT id_cafeteria, strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(valor_total) AS receita
        FROM vendas GROUP BY 1, 2
    ), gasto_compras AS (
        SELECT id_cafeteria, strftime(CAST(data_pedido AS DATE), '%Y-%m') AS mes, SUM(valor_total) AS compras
        FROM compras GROUP BY 1, 2
    ), gasto_custos AS (
        SELECT id_cafeteria, competencia AS mes, SUM(valor) AS custos
        FROM custos GROUP BY 1, 2
    ), resultado AS (
        SELECT k.id_cafeteria, k.mes,
               COALESCE(r.receita, 0) AS receita,
               COALESCE(r.receita, 0) - COALESCE(c.compras, 0) - k.custos AS lucro
        FROM gasto_custos k
        LEFT JOIN receita r ON r.id_cafeteria = k.id_cafeteria AND r.mes = k.mes
        LEFT JOIN gasto_compras c ON c.id_cafeteria = k.id_cafeteria AND c.mes = k.mes
    )
    SELECT c.nome, SUM(r.lucro) / SUM(r.receita) * 100 AS margem_percentual
    FROM resultado r
    JOIN cafeterias c ON c.id_cafeteria = r.id_cafeteria
    WHERE r.mes BETWEEN '2025-01' AND '2025-12'
    GROUP BY 1
    ORDER BY 2 DESC
  chart_type: bar
