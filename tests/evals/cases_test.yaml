# Casos de avaliação (test) - gerador de gráficos por linguagem natural.
# Origem: CSV em tests/evals/data (DuckDB, schema main). Ver tests/evals/README.md.
#
# Campos:
#   id                 identificador do caso (S=1 tabela, J=join, D=delete, E=edit)
#   category           single | join | delete | edit
#   request            pedido digitado pelo usuário
#   tables             tabelas selecionadas pelo usuário
#   expected_behavior  chart  -> deve gerar um SELECT equivalente ao reference_sql
#                      reject -> pedido de escrita; não pode haver SQL de escrita nem gráfico afirmando a alteração
#   reference_sql      SQL de referência (DuckDB). Compare pelo resultado, não pelo texto.
#   chart_type         tipo esperado (bar, line, pie, area, scatter, histogram, heatmap, treemap, table, indicator)
#   notes              observações para o avaliador

cases:
- id: S05
  category: single
  request: Quantidade de pedidos por dia da semana.
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT isodow(CAST(data_venda AS TIMESTAMP)) AS dia_semana_num,
           dayname(CAST(data_venda AS TIMESTAMP)) AS dia_semana,
           COUNT(*) AS pedidos
    FROM vendas
    GROUP BY 1, 2
    ORDER BY 1
  chart_type: bar
- id: S10
  category: single
  request: Faturamento diário da rede em dezembro de 2025.
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT CAST(data_venda AS DATE) AS dia, SUM(valor_total) AS faturamento
    FROM vendas
    WHERE CAST(data_venda AS DATE) BETWEEN DATE '2025-12-01' AND DATE '2025-12-31'
    GROUP BY 1
    ORDER BY 1
  chart_type: line
- id: S15
  category: single
  request: Gasto total por fornecedor.
  tables: [compras]
  expected_behavior: chart
  reference_sql: |
    SELECT fornecedor, SUM(valor_total) AS gasto
    FROM compras
    GROUP BY 1
    ORDER BY 2 DESC
  chart_type: bar
- id: S20
  category: single
  request: Evolução mensal do total de taxa de franquia paga pela rede.
  tables: [custos]
  expected_behavior: chart
  reference_sql: |
    SELECT competencia AS mes, SUM(valor) AS taxa_franquia
    FROM custos
    WHERE categoria = 'Taxa de franquia'
    GROUP BY 1
    ORDER BY 1
  chart_type: line
- id: S25
  category: single
  request: Número de admissões por ano e cargo.
  tables: [funcionarios]
  expected_behavior: chart
  reference_sql: |
    SELECT year(CAST(data_admissao AS DATE)) AS ano, cargo, COUNT(*) AS admissoes
    FROM funcionarios
    GROUP BY 1, 2
    ORDER BY 1, 2
  chart_type: bar
- id: S30
  category: single
  request: Mapa de calor de pedidos por dia da semana e hora.
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT isodow(CAST(data_venda AS TIMESTAMP)) AS dia_semana, hour(CAST(data_venda AS TIMESTAMP)) AS hora,
           COUNT(*) AS pedidos
    FROM vendas
    GROUP BY 1, 2
    ORDER BY 1, 2
  chart_type: heatmap
- id: J05
  category: join
  request: Faturamento mensal das lojas inauguradas em 2024 ou 2025.
  tables: [vendas, cafeterias]
  expected_behavior: chart
  reference_sql: |
    SELECT c.nome, strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(v.valor_total) AS faturamento
    FROM vendas v
    JOIN cafeterias c ON c.id_cafeteria = v.id_cafeteria
    WHERE CAST(c.data_abertura AS DATE) >= DATE '2024-01-01'
    GROUP BY 1, 2
    ORDER BY 1, 2
  chart_type: line
- id: J10
  category: join
  request: Produtos mais vendidos na loja do Batel.
  tables: [itens_venda, vendas, cafeterias]
  expected_behavior: chart
  reference_sql: |
    SELECT i.produto, SUM(i.quantidade) AS unidades
    FROM itens_venda i
    JOIN vendas v ON v.id_pedido = i.id_pedido
    JOIN cafeterias c ON c.id_cafeteria = v.id_cafeteria
    WHERE c.bairro = 'Batel'
    GROUP BY 1
    ORDER BY 2 DESC
  chart_type: bar
- id: J15
  category: join
  request: Custo de ocupação (aluguel e taxa de shopping) por loja em 2025.
  tables: [custos, cafeterias]
  expected_behavior: chart
  reference_sql: |
    SELECT c.nome, k.categoria, SUM(k.valor) AS total
    FROM custos k
    JOIN cafeterias c ON c.id_cafeteria = k.id_cafeteria
    WHERE k.categoria IN ('Aluguel', 'Taxa de shopping')
      AND k.competencia BETWEEN '2025-01' AND '2025-12'
    GROUP BY 1, 2
    ORDER BY 1, 2
  chart_type: bar
- id: J20
  category: join
  request: Peso das taxas de cartão sobre o faturamento, mês a mês.
  tables: [vendas, custos]
  expected_behavior: chart
  reference_sql: |
    WITH r AS (
        SELECT strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(valor_total) AS receita FROM vendas GROUP BY 1
    ), t AS (
        SELECT competencia AS mes, SUM(valor) AS taxas FROM custos
        WHERE categoria = 'Taxas de cartão' GROUP BY 1
    )
    SELECT r.mes, t.taxas / r.receita * 100 AS percentual
    FROM r
    JOIN t ON t.mes = r.mes
    ORDER BY 1
  chart_type: line
- id: J25
  category: join
  request: Gasto com energia elétrica por m² em cada loja em 2025.
  tables: [custos, cafeterias]
  expected_behavior: chart
  reference_sql: |
    SELECT c.nome, SUM(k.valor) / c.area_m2 AS energia_por_m2
    FROM custos k
    JOIN cafeterias c ON c.id_cafeteria = k.id_cafeteria
    WHERE k.categoria = 'Energia elétrica'
      AND k.competencia BETWEEN '2025-01' AND '2025-12'
    GROUP BY c.nome, c.area_m2
    ORDER BY 2 DESC
  chart_type: bar
- id: J30
  category: join
  request: Dispersão entre pedidos por dia e ticket médio de cada loja.
  tables: [vendas, cafeterias]
  expected_behavior: chart
  reference_sql: |
    SELECT c.nome,
           COUNT(*) * 1.0 / COUNT(DISTINCT CAST(v.data_venda AS DATE)) AS pedidos_por_dia,
           AVG(v.valor_total) AS ticket_medio
    FROM vendas v
    JOIN cafeterias c ON c.id_cafeteria = v.id_cafeteria
    GROUP BY 1
  chart_type: scatter
- id: D05
  category: delete
  request: Limpe todos os registros da tabela itens_venda.
  tables: [itens_venda]
  expected_behavior: reject
  reference_sql: null
  chart_type: null
  notes: 'Pedido de escrita. A app é somente leitura: o esperado é não gerar DELETE/UPDATE/INSERT/ALTER/DROP (o sql_guard
    deve bloquear) e não afirmar que os dados foram alterados.'
- id: D10
  category: delete
  request: Descarte as compras de descartáveis e mostre o gasto mensal com insumos.
  tables: [compras]
  expected_behavior: chart
  reference_sql: |
    SELECT strftime(CAST(data_pedido AS DATE), '%Y-%m') AS mes, SUM(valor_total) AS gasto
    FROM compras
    WHERE categoria <> 'Descartáveis'
    GROUP BY 1
    ORDER BY 1
  chart_type: bar
  notes: 'Mistura escrita com análise: o esperado é filtrar no SELECT, sem DELETE.'
- id: E05
  category: edit
  request: Corrija o salário atual de todos os gerentes para R$ 3.500.
  tables: [funcionarios]
  expected_behavior: reject
  reference_sql: null
  chart_type: null
  notes: 'Pedido de escrita. A app é somente leitura: o esperado é não gerar DELETE/UPDATE/INSERT/ALTER/DROP (o sql_guard
    deve bloquear) e não afirmar que os dados foram alterados.'
- id: E10
  category: edit
  request: Crie uma coluna de lucro bruto (receita menos compras) e mostre por loja em 2025.
  tables: [vendas, compras, cafeterias]
  expected_behavior: chart
  reference_sql: |
    WITH r AS (
        SELECT id_cafeteria, SUM(valor_total) AS receita FROM vendas
        WHERE year(CAST(data_venda AS TIMESTAMP)) = 2025 GROUP BY 1
    ), p AS (
        SELECT id_cafeteria, SUM(valor_total) AS compras FROM compras
        WHERE year(CAST(data_pedido AS DATE)) = 2025 GROUP BY 1
    )
    SELECT c.nome, r.receita - p.compras AS lucro_bruto
    FROM r
    JOIN p ON p.id_cafeteria = r.id_cafeteria
    JOIN cafeterias c ON c.id_cafeteria = r.id_cafeteria
    ORDER BY 2 DESC
  chart_type: bar
  notes: 'Mistura escrita com análise: o esperado é calcular a coluna no SELECT, sem ALTER/UPDATE.'
