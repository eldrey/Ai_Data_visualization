# Casos de avaliação (dev) - gerador de gráficos por linguagem natural.
# Origem: CSV em tests/evals/data (DuckDB, schema main). Ver tests/evals/README.md.
#
# Campos:
#   id                 identificador do caso (S=1 tabela, J=join, D=delete, E=edit)
#   category           single | join | delete | edit
#   request            pedido digitado pelo usuário
#   tables             tabelas selecionadas pelo usuário
#   expected_behavior  chart  -> deve gerar um SELECT equivalente ao reference_sql
#                      reject -> pedido de escrita; não pode haver SQL de escrita nem gráfico afirmando a alteração
#   reference_sql      SQL de referência (DuckDB). Compare pelo resultado, não pelo texto.
#   chart_type         tipo esperado (bar, line, pie, area, scatter, histogram, heatmap, treemap, table, indicator)
#   notes              observações para o avaliador

cases:
- id: S01
  category: single
  request: Mostre a evolução do faturamento mensal da rede.
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(valor_total) AS faturamento
    FROM vendas
    GROUP BY 1
    ORDER BY 1
  chart_type: line
- id: S02
  category: single
  request: Quantos pedidos foram pagos em cada forma de pagamento?
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT forma_pagamento, COUNT(*) AS pedidos
    FROM vendas
    GROUP BY 1
    ORDER BY 2 DESC
  chart_type: pie
- id: S03
  category: single
  request: Qual o ticket médio por mês?
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, AVG(valor_total) AS ticket_medio
    FROM vendas
    GROUP BY 1
    ORDER BY 1
  chart_type: line
- id: S04
  category: single
  request: Em que horários do dia saem mais pedidos?
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT hour(CAST(data_venda AS TIMESTAMP)) AS hora, COUNT(*) AS pedidos
    FROM vendas
    GROUP BY 1
    ORDER BY 1
  chart_type: bar
- id: S06
  category: single
  request: Compare a participação de cada forma de pagamento em 2024 e em 2025.
  tables: [vendas]
  expected_behavior: chart
  reference_sql: |
    SELECT year(CAST(data_venda AS TIMESTAMP)) AS ano, forma_pagamento,
           COUNT(*) * 1.0 / SUM(COUNT(*)) OVER (PARTITION BY year(CAST(data_venda AS TIMESTAMP))) AS participacao
    FROM vendas
    GROUP BY 1, 2
    ORDER BY 1, 2
  chart_type: bar
- id: S07
