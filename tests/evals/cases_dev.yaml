    WITH r AS (
        SELECT strftime(CAST(data_venda AS TIMESTAMP), '%Y-%m') AS mes, SUM(valor_total) AS receita FROM vendas GROUP BY 1
    ), p AS (
        SELECT strftime(CAST(data_pedido AS DATE), '%Y-%m') AS mes, SUM(valor_total) AS compras FROM compras GROUP BY 1
