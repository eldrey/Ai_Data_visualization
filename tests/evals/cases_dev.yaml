  expected_behavior: chart
  reference_sql: |
    WITH por_vendedor AS (
        SELECT c.nome AS loja, f.nome AS vendedor, f.cargo, SUM(v.valor_total) AS faturamento
        FROM vendas v
        JOIN funcionarios f ON f.id_funcionario = v.id_vendedor
        JOIN cafeterias c ON c.id_cafeteria = v.id_cafeteria
        GROUP BY 1, 2, 3
    )
    SELECT loja, vendedor, cargo, faturamento
    FROM por_vendedor
    QUALIFY ROW_NUMBER() OVER (PARTITION BY loja ORDER BY faturamento DESC) = 1
    ORDER BY faturamento DESC
  chart_type: table
